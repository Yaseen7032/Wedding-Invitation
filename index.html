<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css" rel="stylesheet">
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>

<style>

/* RESET */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  background: #001933;
  color: white;
  -webkit-text-size-adjust: 100%;
}

/* ROOT MOBILE FIX */
#root {
  max-width: 430px;
  margin: auto;
  overflow-x: hidden;
}

/* FONTS */
.font-script { font-family: 'Allura', cursive; }
.font-heading { font-family: serif; }

/* GLASS */
.glass {
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* GOLD */
.gold-gradient-text {
  background: linear-gradient(to bottom, #FBF5B7, #D4AF37, #B8860B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.gold-gradient-bg {
  background: linear-gradient(135deg,#B8860B,#D4AF37,#FBF5B7);
}

/* PETALS */
#petals-container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
}

.petal {
  position: absolute;
  top: -20px;
  width: 14px;
  height: 14px;
  background: #ffb6c1;
  border-radius: 0 100% 0 100%;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-20px) rotate(0); }
  100% { transform: translateY(110vh) rotate(720deg); }
}

/* FIREWORKS */
#fireworks {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
}

/* EVENT CARD */
.event-card {
  margin-bottom: 16px;
  transition: 0.3s;
}
.event-card:hover {
  transform: translateY(-6px);
}

/* DATE REVEAL */
#dateCard {
  transition: all 0.6s ease;
}

.hidden-card {
  opacity: 0;
  transform: scale(1.2) rotate(10deg);
}

</style>
</head>

<body>

<main id="root">

<!-- HERO -->
<section class="min-h-screen flex items-end p-5">
  <div class="glass p-6 rounded-3xl text-center w-full">
    <h1 class="font-script text-5xl gold-gradient-text">Zubair & Hameeda</h1>
    <p class="text-xs opacity-60 mt-2">Wedding Invitation</p>
  </div>
</section>

<!-- COUNTDOWN -->
<section class="py-10 px-4 text-center">

<h2 class="font-script text-4xl gold-gradient-text mb-6">Countdown</h2>

<div class="grid grid-cols-2 gap-3">

  <div class="glass p-4 rounded-2xl">
    <div id="days" class="text-3xl gold-gradient-text">00</div>
    <div class="text-xs">Days</div>
  </div>

  <div class="glass p-4 rounded-2xl">
    <div id="hours" class="text-3xl gold-gradient-text">00</div>
    <div class="text-xs">Hours</div>
  </div>

  <div class="glass p-4 rounded-2xl">
    <div id="minutes" class="text-3xl gold-gradient-text">00</div>
    <div class="text-xs">Minutes</div>
  </div>

  <div class="glass p-4 rounded-2xl">
    <div id="seconds" class="text-3xl gold-gradient-text">00</div>
    <div class="text-xs">Seconds</div>
  </div>

</div>

</section>

<!-- DATE REVEAL -->
<section class="py-10 px-4 text-center">

<h2 class="font-script text-4xl gold-gradient-text mb-4">Nikah Date</h2>

<div class="relative w-full max-w-[320px] mx-auto">

  <div id="dateReveal" class="glass p-8 rounded-3xl">
    <div class="text-6xl gold-gradient-text">8</div>
    <div class="tracking-widest uppercase">August 2026</div>
  </div>

  <div id="dateCard"
       class="absolute inset-0 gold-gradient-bg rounded-3xl flex items-center justify-center cursor-pointer">
    <p class="text-black font-bold">Tap to Reveal</p>
  </div>

</div>

</section>

<!-- EVENTS -->
<section class="py-10 px-4">

<h2 class="font-script text-4xl gold-gradient-text text-center mb-6">Events</h2>

<div class="event-card glass p-5 rounded-2xl">
  <h3 class="font-heading text-xl">Mehendi</h3>
  <p class="text-xs opacity-60">7 Aug 2026</p>
</div>

<div class="event-card glass p-5 rounded-2xl">
  <h3 class="font-heading text-xl">Nikah</h3>
  <p class="text-xs opacity-60">8 Aug 2026</p>
</div>

<div class="event-card glass p-5 rounded-2xl">
  <h3 class="font-heading text-xl">Reception</h3>
  <p class="text-xs opacity-60">9 Aug 2026</p>
</div>

</section>

<!-- PETALS -->
<div id="petals-container"></div>

<!-- FIREWORKS -->
<canvas id="fireworks"></canvas>

</main>

<script>

/* FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let particles = [];

function createFirework(x,y){
  for(let i=0;i<120;i++){
    particles.push({
      x,y,
      angle:Math.random()*Math.PI*2,
      speed:Math.random()*8+2,
      radius:2,
      alpha:1
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=particles.length-1;i>=0;i--){
    let p = particles[i];

    p.x += Math.cos(p.angle)*p.speed;
    p.y += Math.sin(p.angle)*p.speed;
    p.alpha -= 0.01;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,215,0,${p.alpha})`;
    ctx.fill();

    if(p.alpha<=0) particles.splice(i,1);
  }

  requestAnimationFrame(animate);
}
animate();

/* DATE REVEAL */
document.getElementById("dateCard").onclick = () => {

  document.getElementById("dateCard").classList.add("hidden-card");

  createFirework(innerWidth/2, innerHeight/2);
  setTimeout(()=>createFirework(innerWidth*0.3, innerHeight*0.4),200);
  setTimeout(()=>createFirework(innerWidth*0.7, innerHeight*0.4),400);
};

/* COUNTDOWN */
const weddingDate = new Date("August 8, 2026 10:30:00").getTime();

setInterval(()=>{

  let now = new Date().getTime();
  let d = weddingDate - now;

  document.getElementById("days").innerText = Math.floor(d/86400000);
  document.getElementById("hours").innerText = Math.floor((d%86400000)/3600000);
  document.getElementById("minutes").innerText = Math.floor((d%3600000)/60000);
  document.getElementById("seconds").innerText = Math.floor((d%60000)/1000);

},1000);

/* PETALS */
const container = document.getElementById("petals-container");

function petal(){
  const p = document.createElement("div");
  p.className = "petal";
  p.style.left = Math.random()*innerWidth + "px";
  p.style.animationDuration = (Math.random()*5+5)+"s";
  container.appendChild(p);

  setTimeout(()=>p.remove(),10000);
}
setInterval(petal,120);

</script>

</body>
</html>
